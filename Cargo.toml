[workspace]
resolver = "3"
members = ["crates/anchorleg-core", "crates/anchorleg"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/snehal96/anchorleg"
readme = "README.md"
keywords = ["claude", "codex", "cli", "quota", "agents"]
publish = false

[workspace.dependencies]
anchorleg-core = { path = "crates/anchorleg-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
ratatui = "0.30"
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
insta = { version = "1", features = ["json", "glob"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
