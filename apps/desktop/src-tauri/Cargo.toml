[package]
name = "anchorleg-desktop"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/snehal96/anchorleg"
description = "Desktop app for anchorleg"
publish = false

# Built on its own, not as part of the CLI's workspace: the CLI's CI and releases don't need
# Tauri or a webview toolchain.
[workspace]

[lib]
name = "anchorleg_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
