name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Runs fmt, clippy and the tests. The tests replay captured CLI output against a fake
      # CLI, so they need no Claude account; the mod's tests are skipped without `claude`.
      - run: ./scripts/check.sh
