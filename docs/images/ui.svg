<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="t d">
  <title id="t">anchorleg ui, the session manager</title>
  <desc id="d">A terminal window. Left: the sessions list (a new session entry, session 12 running on claude-home, sessions 11 and 10 done) and the agents list with quota bars (claude-work 92%, claude-home 20%, gpt 5%). Right: session 12's conversation: the task, a test run, anchorleg pausing claude-work at 92% and switching to claude-home, an edit, and all tests passing. Below it, the reply box and the key bar.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:13px}
    .win{fill:#0f151b} .bar{fill:#1c2630} .pane{fill:none;stroke:#3a4754} .focus{fill:none;stroke:#94a3b1}
    .label{fill:#0f151b} .ink{fill:#dce3ea} .muted{fill:#8593a1} .dim{fill:#5d6b78}
    .sig{fill:#f2b53a} .ok{fill:#4fc19a} .user{fill:#2b3540} .track{fill:#26313c} .sel{fill:#26313c}
  </style>
  <rect class="win" width="880" height="420" rx="12"/>
  <path class="bar" d="M0 12 a12 12 0 0 1 12 -12 h856 a12 12 0 0 1 12 12 v22 h-880 z"/>
  <circle cx="20" cy="17" r="5.5" fill="#e0605a"/><circle cx="38" cy="17" r="5.5" fill="#e6b13d"/><circle cx="56" cy="17" r="5.5" fill="#5bbf55"/>
  <text class="muted" x="440" y="21.5" text-anchor="middle" font-size="12">anchorleg ui</text>

  <!-- Sessions -->
  <rect class="pane" x="14" y="46" width="236" height="148" rx="4"/>
  <rect class="label" x="24" y="38" width="76" height="16"/>
  <text class="ink" x="30" y="50.5" font-weight="700">Sessions</text>
  <text class="muted" x="28" y="76">+ New session</text>
  <rect class="sel" x="20" y="86" width="224" height="22" rx="3"/>
  <text x="28" y="101.5"><tspan class="sig">●</tspan><tspan class="ink"> #12 claude-home</tspan></text>
  <text x="28" y="127"><tspan class="ok">✓</tspan><tspan class="muted"> #11 claude-work</tspan></text>
  <text x="28" y="151"><tspan class="ok">✓</tspan><tspan class="muted"> #10 gpt</tspan></text>

  <!-- Agents -->
  <rect class="pane" x="14" y="210" width="236" height="138" rx="4"/>
  <rect class="label" x="24" y="202" width="62" height="16"/>
  <text class="ink" x="30" y="214.5" font-weight="700">Agents</text>
  <text class="ink" x="28" y="242">1 claude-work</text>
  <rect class="track" x="176" y="233" width="60" height="9" rx="4.5"/><rect class="sig" x="176" y="233" width="55" height="9" rx="4.5"/>
  <text class="ink" x="28" y="266">2 claude-home</text>
  <rect class="track" x="176" y="257" width="60" height="9" rx="4.5"/><rect class="ok" x="176" y="257" width="12" height="9" rx="4.5"/>
  <text class="ink" x="28" y="290">3 gpt</text>
  <rect class="track" x="176" y="281" width="60" height="9" rx="4.5"/><rect class="ok" x="176" y="281" width="5" height="9" rx="4.5"/>
  <text class="dim" x="28" y="318" font-size="12">claude: sonnet · high</text>
  <text class="dim" x="28" y="336" font-size="12">codex: gpt-5.6-luna · low</text>

  <!-- Conversation -->
  <rect class="focus" x="262" y="46" width="604" height="226" rx="4"/>
  <rect class="label" x="272" y="38" width="326" height="16"/>
  <text class="ink" x="278" y="50.5" font-weight="700">#12 · claude-home · running · ~/code/app</text>
  <rect class="user" x="268" y="62" width="592" height="24" rx="3"/>
  <text class="ink" x="278" y="79">&gt; fix the failing auth tests</text>
  <text x="278" y="110"><tspan class="ink">⏺ </tspan><tspan class="ink" font-weight="700">Bash</tspan><tspan class="muted">(cargo test auth)</tspan></text>
  <text class="muted" x="278" y="130">  ⎿ 9 passed, 5 failed</text>
  <text class="sig" x="278" y="156">· claude-work paused at a clean point (92%)</text>
  <text class="sig" x="278" y="176">· switching claude-work → claude-home (resuming)</text>
  <text x="278" y="202"><tspan class="ink">⏺ </tspan><tspan class="ink" font-weight="700">Edit</tspan><tspan class="muted">(src/auth/token.rs)</tspan></text>
  <text class="ink" x="278" y="228">⏺ All 14 auth tests pass.</text>
  <text class="sig" x="278" y="256">✻ <tspan class="muted">Working…</tspan></text>

  <!-- Reply box -->
  <rect class="pane" x="262" y="288" width="604" height="60" rx="4"/>
  <rect class="label" x="272" y="280" width="226" height="16"/>
  <text class="ink" x="278" y="292.5" font-weight="700">Reply to #12 (Enter to send)</text>
  <text class="ink" x="278" y="324">&gt; <tspan class="muted">/model opus</tspan></text>
  <rect x="384" y="313" width="8" height="15" fill="#dce3ea"/>

  <!-- key bar -->
  <text class="muted" x="20" y="384"><tspan class="ink">n</tspan> new   <tspan class="ink">/</tspan> message   <tspan class="ink">⏎</tspan> send   <tspan class="ink">1 2 3</tspan> approve   <tspan class="ink">s</tspan> stop   <tspan class="ink">o</tspan> settings   <tspan class="ink">?</tspan> help   <tspan class="ink">q</tspan> quit</text>
</svg>
