<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
  <title id="t">What anchorleg does when an account runs low</title>
  <desc id="d">Three steps: pause the task at a clean step when the account reaches 92% of its 5-hour window; hand off by writing .handoff/TASK.md and a local git checkpoint; continue the same session on the next account with room.</desc>
  <style>
    .bg{fill:#eef1f4} .card{fill:#ffffff;stroke:#d5dce3} .ink{fill:#14202b} .muted{fill:#566572}
    .sig{fill:#b86e00} .sigfill{fill:#f0a52b} .ok{fill:#1d7a5f} .track{fill:#e3e8ee}
    .arrow{stroke:#566572;fill:none} .head{fill:#566572} .num{fill:#14202b} .numtext{fill:#ffffff}
    .icon{fill:none;stroke:#566572}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0f151b} .card{fill:#161e26;stroke:#26313c} .ink{fill:#dce3ea} .muted{fill:#94a3b1}
      .sig{fill:#f2b53a} .sigfill{fill:#f2b53a} .ok{fill:#4fc19a} .track{fill:#26313c}
      .arrow{stroke:#94a3b1} .head{fill:#94a3b1} .num{fill:#dce3ea} .numtext{fill:#0f151b}
      .icon{stroke:#94a3b1}
    }
  </style>
  <rect class="bg" width="880" height="300" rx="14"/>
  <text class="muted" x="440" y="34" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">WHEN AN ACCOUNT RUNS LOW</text>

  <!-- 1 Pause -->
  <rect class="card" x="24" y="52" width="250" height="186" rx="10"/>
  <circle class="num" cx="46" cy="80" r="11"/>
  <text class="numtext" x="46" y="84.5" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text class="ink" x="64" y="85" font-size="17" font-weight="700">Pause</text>
  <text class="muted" x="40" y="110" font-size="12.5">at a clean step, never mid-edit</text>
  <text class="ink mono" x="40" y="146" font-size="13">claude-work</text>
  <text class="sig mono" x="258" y="146" font-size="13" text-anchor="end">92%</text>
  <rect class="track" x="40" y="156" width="218" height="10" rx="5"/>
  <rect class="sigfill" x="40" y="156" width="200" height="10" rx="5"/>
  <text class="muted mono" x="40" y="184" font-size="11.5">5-hour window</text>
  <text class="muted" x="40" y="218" font-size="12.5">stops at 90% (--stop-at)</text>

  <!-- arrow -->
  <path class="arrow" d="M280 145 H306" stroke-width="2"/>
  <path class="head" d="M308 145 l-8 -5 v10 z"/>

  <!-- 2 Hand off -->
  <rect class="card" x="315" y="52" width="250" height="186" rx="10"/>
  <circle class="num" cx="337" cy="80" r="11"/>
  <text class="numtext" x="337" y="84.5" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <text class="ink" x="355" y="85" font-size="17" font-weight="700">Hand off</text>
  <text class="muted" x="331" y="110" font-size="12.5">written from the transcript</text>
  <path class="icon" d="M333 128 h16 l7 7 v22 h-23 z M349 128 v7 h7" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="ink mono" x="366" y="141" font-size="12.5">.handoff/TASK.md</text>
  <text class="muted" x="366" y="158" font-size="11.5">goal · steps · files · notes</text>
  <path class="icon" d="M331 192 h7 M350 192 h7" stroke-width="1.6"/>
  <circle class="icon" cx="344" cy="192" r="6" stroke-width="1.6"/>
  <text class="ink mono" x="366" y="196" font-size="12.5">refs/anchorleg/run-12/1</text>
  <text class="muted" x="366" y="213" font-size="11.5">local checkpoint, never pushed</text>

  <!-- arrow -->
  <path class="arrow" d="M571 145 H597" stroke-width="2"/>
  <path class="head" d="M599 145 l-8 -5 v10 z"/>

  <!-- 3 Continue -->
  <rect class="card" x="606" y="52" width="250" height="186" rx="10"/>
  <circle class="num" cx="628" cy="80" r="11"/>
  <text class="numtext" x="628" y="84.5" font-size="13" font-weight="700" text-anchor="middle">3</text>
  <text class="ink" x="646" y="85" font-size="17" font-weight="700">Continue</text>
  <text class="muted" x="622" y="110" font-size="12.5">on the next account with room</text>
  <text class="ink mono" x="622" y="146" font-size="13">claude-home</text>
  <text class="ok mono" x="840" y="146" font-size="13" text-anchor="end">20%</text>
  <rect class="track" x="622" y="156" width="218" height="10" rx="5"/>
  <rect class="ok" x="622" y="156" width="44" height="10" rx="5"/>
  <text class="muted mono" x="622" y="184" font-size="11.5">5-hour window</text>
  <text class="muted" x="622" y="218" font-size="12.5">same session, resumed</text>

  <text class="muted" x="440" y="272" font-size="12.5" text-anchor="middle">Next account on another CLI (Codex, Antigravity)? It starts a fresh session from TASK.md instead.</text>
</svg>
